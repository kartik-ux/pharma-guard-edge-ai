[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-guard-edge-ai"
version = "0.1.0"
description = "Edge AI pharmaceutical cold-chain monitoring prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "paho-mqtt>=2.1",
    "python-dotenv>=1.0"
]

[tool.setuptools.packages.find]
include = ["pharma_guard*"]
